name: Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Lean in the browser for Leandoku. Usually finds the runtime already
  # published and finishes in seconds; a changed bridge or Lean version
  # rebuilds it, which takes a couple of hours.
  leandoku-runtime:
    uses: ./.github/workflows/leandoku-runtime.yml
    permissions:
      contents: write
  build:
    runs-on: ubuntu-latest
    needs: leandoku-runtime
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leandoku/package-lock.json
      - name: Build Leandoku into public/leandoku
        working-directory: leandoku
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_LEANDOKU_RUNTIME: ${{ needs.leandoku-runtime.outputs.version }}
        run: |
          npm ci
          gh release download "leandoku-runtime-$VITE_LEANDOKU_RUNTIME" --dir "public/runtime/$VITE_LEANDOKU_RUNTIME"
          LEANDOKU_OUT_DIR=../public/leandoku npm run build
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
