name: Leandoku

on:
  push:
    branches: [main]
    paths: ['leandoku/**', '.github/workflows/leandoku.yml']
  pull_request:
    paths: ['leandoku/**', '.github/workflows/leandoku.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leandoku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leandoku/package-lock.json
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            leandoku/lean/.lake
          key: lean-${{ hashFiles('leandoku/lean/lean-toolchain', 'leandoku/lean/**/*.lean', 'leandoku/lean/lakefile.toml') }}
          restore-keys: lean-
      - run: npm ci
      - run: npm run bridge:build
      - run: npm run typecheck
      - run: npm test
        env:
          LEANDOKU_LEAN_TESTS: '1'
