<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reels</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-shaped column holding the reels feed (full-bleed snap scroll) or the posts feed, with chrome floating over it; wider screens center the column on a dark field. */
:root{
  --void:#08070b;
  --screen:#000000;
  --surface:#121016;
  --raise:rgba(255,255,255,.055);
  --ink:#f4f2f8;
  --ink-dim:rgba(244,242,248,.66);
  --ink-faint:rgba(244,242,248,.38);
  --glass:rgba(18,16,24,.55);
  --line:rgba(244,242,248,.14);
  --l4:#ff5fa8;
  --l3:#3fd0b8;
  --l2:#b9b7c0;
  --l1:#ffffff;
  --good:#3fd0b8;
  --warn:#ffb547;
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stage{height:100%;display:flex;justify-content:center}
.app{position:relative;height:100%;width:100%;max-width:calc(100dvh * .58);background:var(--screen);overflow:hidden;isolation:isolate}
@media (min-width:700px){.app{box-shadow:0 0 0 1px var(--line),0 40px 120px rgba(0,0,0,.7)}}

/* feed */
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--screen)}
.slide canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.slide::after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(transparent,rgba(0,0,0,.45) 45%,rgba(0,0,0,.8));pointer-events:none}

.cap{position:absolute;z-index:1;left:max(16px,env(safe-area-inset-left,0px));right:88px;bottom:calc(26px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.cap h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;text-wrap:balance}
.cap .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.8rem;color:var(--ink-dim)}
.seed{font-variant-numeric:tabular-nums;letter-spacing:.04em;opacity:.8}

.top{position:absolute;z-index:3;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.mark{justify-self:start;font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:-.03em}
.mark span{opacity:.45}

.rail{position:absolute;z-index:3;right:max(12px,env(safe-area-inset-right,0px));bottom:96px;display:flex;flex-direction:column;gap:16px}
.rail button{display:grid;justify-items:center;gap:5px;border:0;background:none;padding:0;font-size:.7rem;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rail .ic{width:48px;height:48px;border-radius:50%;background:var(--glass);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.rail button:active .ic{transform:scale(.9)}

.progress{position:absolute;z-index:3;inset:auto 0 0;height:2px;background:rgba(255,255,255,.14);pointer-events:none}
.progress i{display:block;height:100%;width:100%;background:rgba(255,255,255,.85);transform-origin:left;transform:scaleX(0)}


.toast{position:absolute;z-index:30;top:70px;left:50%;transform:translate(-50%,-8px);max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;background:rgba(10,9,14,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:500;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.pauseglyph{position:absolute;z-index:2;top:50%;left:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;pointer-events:none}
.pauseglyph svg{width:36px;height:36px;fill:currentColor;stroke:none}
.pauseglyph.show{opacity:1;transform:scale(1)}

.hint{position:absolute;z-index:2;left:50%;bottom:130px;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;transition:opacity .4s}
.hint svg{animation:nudge 1.6s ease-in-out infinite}
.hint.gone{opacity:0}
@keyframes nudge{0%,100%{transform:translateY(6px);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

.fswitch{justify-self:center;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fswitch button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.84rem;color:var(--ink-dim)}
.fswitch button[aria-pressed="true"]{background:var(--ink);color:var(--screen)}
.postsmount{position:absolute;inset:60px 0 0;z-index:2;background:var(--screen);overflow:hidden}
.posts .rail,.posts .progress,.posts .hint{display:none}
.posts .top{background:var(--screen);padding-block:12px 10px;border-bottom:1px solid var(--line)}

.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.iconbtn svg{width:18px;height:18px}

.keys{position:fixed;left:24px;bottom:24px;display:none;gap:6px;font-size:.82rem;color:var(--ink-dim);line-height:1.5}
.keys kbd{font:600 .75rem var(--f-body);padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink)}
@media (min-width:1000px) and (hover:hover){.keys{display:grid}}

@media (prefers-reduced-motion:reduce){.hint svg{animation:none}.toast{transition:none}}

/* sheets */
.label{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
.help{font-size:.84rem;color:var(--ink-dim);margin:10px 2px 0;line-height:1.45}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--raise)}
.seg button{border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:600;font-size:.9rem;color:var(--ink-dim);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:none;font-weight:600;font-size:.92rem}
.btn.solid{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scrim{position:absolute;z-index:20;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:21;inset:auto 0 0;display:grid;gap:20px;background:var(--surface);border-radius:22px 22px 0 0;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.linkbox{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:500 .85rem var(--f-body);-webkit-user-select:text;user-select:text}
.top .gear{justify-self:end}
#shareName{text-transform:none;letter-spacing:0;color:var(--ink-dim)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

</style>

<div class="stage">
  <div class="app" id="app">
    <div class="feed" id="feed" aria-label="Reels"></div>
    <div class="postsmount" id="postsMount" hidden></div>

    <div class="top">
      <div class="mark" id="mark">reels<span>.</span></div>
      <div class="fswitch" id="fswitch" hidden>
        <button id="fs-reels" data-feed="reels" aria-pressed="true">Reels</button>
        <button id="fs-posts" data-feed="posts" aria-pressed="false">Posts</button>
      </div>
      <button class="iconbtn gear" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>

    <div class="rail">
      <button id="shareBtn" aria-label="Share this reel">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M14 5l7 7-7 7M21 12H10a7 7 0 0 0-7 7"/></svg></span>Share
      </button>
    </div>

    <div class="pauseglyph" id="glyph"></div>
    <div class="hint" id="hint"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>Swipe up</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="grab"></div>
      <div>
        <div class="label">Winds down over</div>
        <div class="seg" id="windSeg">
          <button id="wind-10" data-wind="10">10 min</button>
          <button id="wind-20" data-wind="20">20 min</button>
          <button id="wind-40" data-wind="40">40 min</button>
        </div>
        <p class="help">The feed starts vivid each day and slowly turns into plain shapes as you scroll.</p>
      </div>
      <div class="row">
        <button class="btn solid" id="done">Done</button>
        <button class="btn" id="fresh">Start fresh</button>
      </div>
    </div>
    <div class="sheet" id="shareSheet" role="dialog" aria-modal="true" aria-label="Share reel">
      <div class="grab"></div>
      <div>
        <div class="label">Share <span id="shareName"></span></div>
        <input class="linkbox" id="shareUrl" readonly aria-label="Link to this reel">
        <p class="help">Copy the link. Anyone who opens it sees this exact reel.</p>
      </div>
      <div class="row"><button class="btn solid" id="shareDone">Done</button></div>
    </div>
  </div>
</div>
<div class="keys" aria-hidden="true">
  <div><kbd>↑</kbd> <kbd>↓</kbd> or scroll to move between reels</div>
  <div><kbd>Space</kbd> pause · <kbd>P</kbd> reels or posts</div>
</div>

<script>
(() => {
const TAU = Math.PI * 2;
/* ---------- helpers ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function poly(c, x, y, rad, n, rot) { c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + i * TAU / n - Math.PI / 2; const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad; i ? c.lineTo(px, py) : c.moveTo(px, py); } c.closePath(); }
function shapePath(c, type, x, y, rad, rot) { if (type === 0) { c.beginPath(); c.arc(x, y, rad, 0, TAU); } else poly(c, x, y, rad, type === 1 ? 3 : type === 2 ? 4 : 6, rot); }
function hsl2rgb(h, s, l) { const a = s * Math.min(l, 1 - l); const f = n => { const k = (n + h * 12) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }; return [f(0) * 255, f(8) * 255, f(4) * 255]; }
const LUT = new Uint8ClampedArray(360 * 3);
for (let h = 0; h < 360; h++) { const [r, g, b] = hsl2rgb(h / 360, 1, .55); LUT[h * 3] = r; LUT[h * 3 + 1] = g; LUT[h * 3 + 2] = b; }
const bw = (r, p = .7) => r() < p ? ['#000', '#fff'] : ['#fff', '#000'];
const PALETTES = [
  ['#1d3557', '#e76f51', '#f4a261', '#2a9d8f', '#e9c46a'],
  ['#22223b', '#c9ada7', '#9a8c98', '#f2e9e4', '#4a4e69'],
  ['#0b3954', '#bfd7ea', '#ff6663', '#e0ff4f', '#087e8b'],
  ['#2b2d42', '#8d99ae', '#ef233c', '#edf2f4', '#ffb703'],
  ['#16302b', '#694873', '#8b728e', '#85b79d', '#c0e5c8'],
  ['#3d348b', '#7678ed', '#f7b801', '#f18701', '#f35b04'],
  ['#f6efe6', '#264653', '#e76f51', '#2a9d8f', '#e9c46a'],
];

/* ---------- reel generators, grouped by level ---------- */
const GENS = {
4: [
  { name: 'Kaleidoscope',
    make(r) { return { segs: 6 + 2 * Math.floor(r() * 4), hue: r() * 360, shapes: Array.from({ length: 16 }, () => ({ d: r(), s: .2 + r() * .9, ph: r() * TAU, sz: .03 + r() * .09, h: r() * 140, type: Math.floor(r() * 4), sp: .3 + r() * .8 })) }; },
    draw(c, w, h, t, s) {
      const cx = w / 2, cy = h / 2, R = Math.hypot(w, h) / 2, a = TAU / s.segs, m = Math.min(w, h);
      c.fillStyle = `hsl(${s.hue + t * 25},70%,7%)`; c.fillRect(0, 0, w, h);
      c.globalCompositeOperation = 'lighter';
      for (let k = 0; k < s.segs; k++) {
        c.save(); c.translate(cx, cy);
        if (k % 2) { c.rotate((k + 1) * a + t * .2); c.scale(1, -1); } else c.rotate(k * a + t * .2);
        c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, 0, a + .002); c.closePath(); c.clip();
        for (const p of s.shapes) {
          const d = (.06 + p.d * .9 + .15 * Math.sin(t * p.sp + p.ph)) * R * .9;
          const th = a * (.5 + .5 * Math.sin(t * p.s + p.ph * 2));
          const z = p.sz * m * (1 + .4 * Math.sin(t * 2 * p.sp + p.ph));
          c.fillStyle = `hsla(${s.hue + p.h + t * 40},95%,58%,.55)`;
          shapePath(c, p.type, Math.cos(th) * d, Math.sin(th) * d, z, t * p.sp * 2); c.fill();
        }
        c.restore();
      }
    } },
  { name: 'Tunnel',
    make(r) { return { sides: 3 + Math.floor(r() * 5), hue: r() * 360, twist: .08 + r() * .2, dir: r() < .5 ? -1 : 1 }; },
    draw(c, w, h, t, s) {
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      const R = Math.hypot(w, h) * .8, N = 34, base = t * 2.2, fr = base % 1, fl = Math.floor(base);
      const cx = w / 2 + Math.sin(t * .7) * w * .06, cy = h / 2 + Math.cos(t * .5) * h * .05;
      c.lineJoin = 'round';
      for (let i = 0; i < N; i++) {
        const z = (i + fr) / N, id = i - fl, rr = z * z * z * R;
        c.lineWidth = 1 + z * z * 26;
        c.strokeStyle = `hsl(${s.hue + id * 14 + t * 30},100%,60%)`;
        poly(c, cx, cy, rr, s.sides, s.dir * (id * s.twist + t * .6)); c.stroke();
      }
    } },
  { name: 'Bloom',
    make(r) { return { n: 900, hue: r() * 360, drift: .0006 + r() * .0016 }; },
    draw(c, w, h, t, s) {
      c.fillStyle = '#05030a'; c.fillRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2, R = Math.hypot(w, h) / 2, k = R / Math.sqrt(s.n), ga = 2.39996323 + Math.sin(t * .15) * s.drift;
      for (let i = 0; i < s.n; i++) {
        const a = i * ga + t * .4, rr = k * Math.sqrt(i);
        const sz = (1.5 + rr / R * 7) * (.7 + .3 * Math.sin(t * 3 - i * .02));
        c.fillStyle = `hsl(${s.hue + i * .4 - t * 60},95%,60%)`;
        c.beginPath(); c.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, sz, 0, TAU); c.fill();
      }
    } },
  { name: 'Plasma',
    make(r) { const cv = document.createElement('canvas'); cv.width = 54; cv.height = 96; return { cv, cx: cv.getContext('2d'), img: null, hue: r() * 360, f: .8 + r() * .6 }; },
    draw(c, w, h, t, s) {
      const W = s.cv.width, H = s.cv.height;
      if (!s.img) s.img = s.cx.createImageData(W, H);
      const d = s.img.data, ox = W / 2 + Math.sin(t * .6) * 14, oy = H / 2 + Math.cos(t * .4) * 20;
      let p = 0;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const v = Math.sin(x * .16 * s.f + t * 1.3) + Math.sin(y * .11 * s.f - t * 1.7) + Math.sin((x + y) * .09 + t) + Math.sin(Math.hypot(x - ox, y - oy) * .2 * s.f - t * 2.2);
        const hh = ((((v * 45 + s.hue + t * 40) % 360) + 360) % 360 | 0) * 3;
        d[p++] = LUT[hh]; d[p++] = LUT[hh + 1]; d[p++] = LUT[hh + 2]; d[p++] = 255;
      }
      s.cx.putImageData(s.img, 0, 0);
      c.imageSmoothingEnabled = true; c.drawImage(s.cv, 0, 0, w, h);
    } },
  { name: 'Interference',
    make(r) { return { hue: r() * 360, gap: 14 + r() * 10 }; },
    draw(c, w, h, t, s) {
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      c.globalCompositeOperation = 'lighter'; c.lineWidth = s.gap * .45;
      const R = Math.hypot(w, h);
      const sets = [[Math.sin(t * .8) * w * .25, Math.cos(t * .6) * h * .2, s.hue], [Math.cos(t * .7) * w * .25, Math.sin(t * .9) * h * .2, s.hue + 150]];
      for (const [ox, oy, hue] of sets) {
        const x0 = w / 2 + ox, y0 = h / 2 + oy;
        c.strokeStyle = `hsl(${hue + t * 30},100%,55%)`; c.beginPath();
        for (let rr = (t * 30) % s.gap + 1; rr < R; rr += s.gap) { c.moveTo(x0 + rr, y0); c.arc(x0, y0, rr, 0, TAU); }
        c.stroke();
      }
    } },
],
3: [
  { name: 'Drift',
    make(r) { const pal = pick(r, PALETTES); return { pal, items: Array.from({ length: 8 }, () => ({ x: r(), y: r(), r: .08 + r() * .16, c: pal[1 + Math.floor(r() * 4)], sx: .05 + r() * .12, sy: .04 + r() * .1, ph: r() * TAU, type: Math.floor(r() * 3) })) }; },
    draw(c, w, h, t, s) {
      c.fillStyle = s.pal[0]; c.fillRect(0, 0, w, h); const m = Math.min(w, h); c.globalAlpha = .9;
      for (const p of s.items) { c.fillStyle = p.c; shapePath(c, p.type, (p.x + .25 * Math.sin(t * p.sx + p.ph)) * w, (p.y + .2 * Math.cos(t * p.sy + p.ph)) * h, p.r * m, t * p.sx); c.fill(); }
    } },
  { name: 'Tiles',
    make(r) { return { pal: pick(r, PALETTES), cols: 4 + Math.floor(r() * 3) }; },
    draw(c, w, h, t, s) {
      c.fillStyle = s.pal[0]; c.fillRect(0, 0, w, h);
      const sz = w / s.cols, rows = Math.ceil(h / sz) + 1;
      for (let i = 0; i < s.cols; i++) for (let j = 0; j < rows; j++) {
        const ph = t * .6 - (i + j) * .35, k = (.55 + .25 * Math.sin(ph)) * sz;
        c.save(); c.translate((i + .5) * sz, (j + .5) * sz); c.rotate(Math.sin(ph) * Math.PI / 4);
        c.fillStyle = s.pal[1 + (i + j) % 4]; c.fillRect(-k / 2, -k / 2, k, k); c.restore();
      }
    } },
  { name: 'Tide',
    make(r) { return { pal: pick(r, PALETTES), ph: r() * TAU }; },
    draw(c, w, h, t, s) {
      c.fillStyle = s.pal[0]; c.fillRect(0, 0, w, h);
      for (let k = 0; k < 5; k++) {
        const base = h * (.28 + k * .15); c.beginPath(); c.moveTo(0, h);
        for (let x = 0; x <= w + 8; x += 8) c.lineTo(x, base + Math.sin(x / w * TAU * (.8 + k * .3) + t * (.35 + k * .08) + k + s.ph) * h * .04);
        c.lineTo(w, h); c.closePath(); c.fillStyle = s.pal[1 + k % 4]; c.fill();
      }

  const m = /^#r-([0-9a-f]{1,8})-(\d{1,3})$/.exec(location.hash || '');
  return m ? { seed: parseInt(m[1], 16) | 0, s: Math.min(999, +m[2]) / 999 } : null;
}

/* ---------- reels ---------- */
const feed = $('feed');
let slides = [], active = -1, paused = false, scrollingUntil = 0, saveAt = 0, feedKind = 'reels';
const seedTag = n => '#' + (n >>> 0).toString(16).padStart(8, '0').slice(-6);

function makeSlide(fixed) {
  const el = document.createElement('section');
  el.className = 'slide';
  feed.appendChild(el);
  // Unless it came from a shared link, the recipe is built in attach(), at the stimulation of the moment it comes up.
  const sl = { el, seed: fixed ? fixed.seed : (Math.random() * 2 ** 31) | 0, s: fixed ? fixed.s : null, canvas: null, ctx: null, t: 0, state: null };
  slides.push(sl);
  return sl;
}
function fill(n = 5) { for (let i = 0; i < n; i++) makeSlide(); }

function dims() { const r = feed.getBoundingClientRect(); return { w: r.width, h: r.height, dpr: Math.min(window.devicePixelRatio || 1, 2) }; }
function sizeSlide(sl) {
  const d = dims(); sl.w = d.w; sl.h = d.h; sl.dpr = Math.min(d.dpr, sl.s > .75 ? 1.5 : 2);
  sl.canvas.width = Math.round(d.w * sl.dpr); sl.canvas.height = Math.round(d.h * sl.dpr);
  if (sl.state) sl.state._fresh = true;
}
function attach(sl) {
  if (sl.canvas) return;
  if (!sl.state) {
    const r = rng(sl.seed);
    if (sl.s == null) sl.s = stimNow();
    sl.state = buildRecipe(r, sl.s); sl.t = 3 + r() * 12;
    sl.el.setAttribute('aria-label', sl.state.name);
    sl.el.innerHTML = `<div class="cap"><h2>${sl.state.name}</h2><div class="meta"><span class="seed">${seedTag(sl.seed)}</span></div></div>`;
  }
  sl.canvas = document.createElement('canvas'); sl.el.prepend(sl.canvas); sl.ctx = sl.canvas.getContext('2d');
  sizeSlide(sl); render(sl);
}
function detach(sl) { if (!sl.canvas) return; sl.canvas.width = sl.canvas.height = 0; sl.canvas.remove(); sl.canvas = sl.ctx = null; }
function render(sl) {
  const c = sl.ctx; c.setTransform(sl.dpr, 0, 0, sl.dpr, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  drawRecipe(c, sl.w, sl.h, sl.t, sl.state);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}
// canvases exist only for the active reel and its two neighbours
const neighbours = () => slides.forEach((sl, j) => Math.abs(j - active) <= 1 ? attach(sl) : detach(sl));

function setActive(i) {
  if (i === active || !slides[i]) return;
  active = i; neighbours();
  if (i >= slides.length - 3) fill();
  if (i > 0) $('hint').classList.add('gone');
}
function goTo(i) { feed.scrollTo({ top: i * feed.clientHeight, behavior: reduce ? 'auto' : 'smooth' }); }
// Drop the reels below the current one so the next ones pick up the current stimulation.
function regenerateAhead() {
  for (let i = slides.length - 1; i > active; i--) { detach(slides[i]); slides[i].el.remove(); slides.pop(); }
  fill(); neighbours();
}

let raf = 0;
feed.addEventListener('scroll', () => {
  scrollingUntil = performance.now() + 250;
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; setActive(Math.round(feed.scrollTop / feed.clientHeight)); });
}, { passive: true });

const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>';
function setPaused(p) {
  paused = p;
  const g = $('glyph'); g.innerHTML = p ? '<svg viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>' : PLAY;
  g.classList.add('show'); clearTimeout(g._t); g._t = setTimeout(() => g.classList.remove('show'), 600);
}
feed.addEventListener('click', () => setPaused(!paused));

/* ---------- share ---------- */
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function closeShare() { $('shareSheet').classList.remove('open'); $('scrim').classList.remove('open'); }
$('shareBtn').onclick = async () => {
  const sl = slides[active]; if (!sl || !sl.state) return;
  const url = `${HOME}#${reelHash(sl)}`;
  try { if (navigator.share) { await navigator.share({ title: sl.state.name, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); return; } catch (e) {}
  // Last resort: show the link so it can be copied by hand.

$('shareDone').onclick = closeShare;

/* ---------- posts (module inlined by build.py) ---------- */
function setFeedKind(kind) {
  if (!window.WaneTextFeed || kind === feedKind) return;
  feedKind = kind;
  for (const b of $('fswitch').children) b.setAttribute('aria-pressed', String(b.dataset.feed === kind));
  const m = $('postsMount');
  $('app').classList.toggle('posts', kind === 'posts');
  $('mark').firstChild.nodeValue = kind; document.title = kind;
  if (kind === 'posts') {
    m.hidden = false;
    try { window.WaneTextFeed.mount(m, { stim: stimNow(), stimAt: stimNow, decay: 0, floor: 0 }); } catch (e) { console.error(e); }

    try { window.WaneTextFeed.unmount(); } catch (e) {}

$('fswitch').onclick = e => { const b = e.target.closest('button'); if (b) setFeedKind(b.dataset.feed); };

/* ---------- settings sheet ---------- */
function paintSheet() { for (const b of $('windSeg').children) b.setAttribute('aria-pressed', String(+b.dataset.wind === S.wind)); }

function closeSheet() { $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); }
$('openSettings').onclick = openSheet;
$('scrim').onclick = () => { closeSheet(); closeShare(); };
$('done').onclick = closeSheet;
$('windSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.wind = +b.dataset.wind; save(); paintSheet(); regenerateAhead();
};
$('fresh').onclick = () => {
  C.secs = 0; saveC(); regenerateAhead();
  if (feedKind === 'posts' && window.WaneTextFeed) window.WaneTextFeed.setStim(stimNow());
  closeSheet(); toast('Starting fresh');
};

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if ($('sheet').classList.contains('open') || $('shareSheet').classList.contains('open')) { if (e.key === 'Escape') { closeSheet(); closeShare(); } return; }
  if (e.key === 'p') return setFeedKind(feedKind === 'posts' ? 'reels' : 'posts');
  if (feedKind !== 'reels') return;
  if (['ArrowDown', 'PageDown', 'j'].includes(e.key)) { e.preventDefault(); goTo(active + 1); }
  else if (['ArrowUp', 'PageUp', 'k'].includes(e.key)) { e.preventDefault(); goTo(Math.max(0, active - 1)); }
  else if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
});

/* ---------- frame loop ---------- */
let last = performance.now();
function frame(now) {
  // rAF timestamps can trail performance.now(), so never let time run backwards
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
  if (!document.hidden) {
    C.secs += dt;
    if (now > saveAt) { saveAt = now + 5000; const k = dayKey(new Date()); if (k !== C.day) C = { day: k, secs: 0 }; saveC(); }
  }
  if (feedKind === 'reels' && !document.hidden) {
    const a = slides[active];
    if (a && a.ctx) {
      if (!paused) a.t += dt * SPEED;
      render(a);
      const loop = lerp(24, 8, a.s);
      $('bar').style.transform = `scaleX(${(a.t % loop) / loop})`;
    }
    if (now < scrollingUntil) for (const j of [active - 1, active + 1]) { const n = slides[j]; if (n && n.ctx) { n.t += dt * SPEED; render(n); } }
  }
  requestAnimationFrame(frame);
}

new ResizeObserver(() => {
  slides.forEach(sl => { if (sl.canvas) { sizeSlide(sl); render(sl); } });
  if (active >= 0) feed.scrollTop = active * feed.clientHeight;
}).observe(feed);
document.addEventListener('visibilitychange', () => { last = performance.now(); saveC(); });
window.addEventListener('pagehide', saveC);

/* ---------- boot: straight into the feed, opening on a shared reel if the link has one ---------- */
const shared = parseHash();
if (shared) makeSlide(shared);
fill(); setActive(0);
requestAnimationFrame(frame);
const offerPosts = () => { if (window.WaneTextFeed && window.WaneTextFeed.mount) $('fswitch').hidden = false; };
window.addEventListener('load', offerPosts); setTimeout(offerPosts, 0);

})();
</script>

<script>
/* Wane text feed: a Twitter-style timeline where every word is a placeholder bar and every avatar and picture is generated.
   Every post is a pure function of (seed, stimulation). Stimulation s is continuous in [0,1]: 1 is the most vivid, 0 the calmest,
   and the old levels are just points on it (4 = 1, 3 = .67, 2 = .33, 1 = 0). Nothing is bucketed: saturation, contrast, motion,
   how many shapes, how often pictures appear and how busy the text looks all slide smoothly with s.
   Styles live in textfeed.css (all classes prefixed tf-). Touches nothing at document level: no keydown, no window scroll.
   API: WaneTextFeed.mount(el, opts), unmount(), setStim(s), setLevel(n), setDecay(d), end(reason), restart(s), stim, level, post(seed, s).
   opts: stim (starting s, default 1), decay (s lost per post, default 1/24), floor (s never goes below it, default 0),
         stimAt (optional () => s; when given, each new post takes s = stimAt() and decay is ignored),
         chrome (own top bar, default false), onStim(s), onLevel(level), onSeen(post), onEnd(reason), onRestart().
   The feed never ends: s settles at floor and posts keep coming. */
(() => {
const TAU = Math.PI * 2;
const LV = {
  4: { name: 'Vivid', color: '#ff5fa8' },
  3: { name: 'Color', color: '#3fd0b8' },
  2: { name: 'Mono',  color: '#b9b7c0' },
  1: { name: 'Still', color: '#ffffff' },
};
const levelOf = s => 1 + Math.round(Math.max(0, Math.min(1, s)) * 3);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const between = (r, a, b) => a + r() * (b - a);
function poly(c, x, y, rad, n, rot) { c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + i * TAU / n - Math.PI / 2; const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad; i ? c.lineTo(px, py) : c.moveTo(px, py); } c.closePath(); }
function shapePath(c, type, x, y, rad, rot) { if (type === 0) { c.beginPath(); c.arc(x, y, rad, 0, TAU); } else poly(c, x, y, rad, type === 1 ? 3 : type === 2 ? 4 : 6, rot); }

/* ---------- the stimulation curves, shared by every generator ---------- */
// chroma: how colorful. Gone below s≈.3, so the lower third reads as black and white.
const chroma = s => smooth(.3, .9, s);
// motion: how fast things move. Never quite zero, so the calm end still breathes.
const motion = s => lerp(.06, 1, s * s);
// count: how many elements, from one at s=0 to n at s=1.
const count = (s, n) => Math.max(1, Math.round(lerp(1, n, Math.pow(s, 1.3))));
// A look derived once per seed: base hue, hue spread, and whether the calm end is ink-on-paper or paper-on-ink.
function look(r, s) { return { h: r() * 360, spread: lerp(40, 160, r()) * chroma(s), light: r() < .35, s }; }
// Picture colours come from cosine gradients (a + b·cos 2π(c·x + d)), so every colour in a picture sits in harmony.
// The gradient and its offset are read off the look's hue, so no extra randomness is drawn.
const COSINES = [
  [[.5, .5, .5], [.5, .5, .5], [1, 1, 1], [0, .33, .67]],
  [[.5, .5, .5], [.5, .5, .5], [1, 1, 1], [0, .1, .2]],
  [[.5, .5, .5], [.5, .5, .5], [1, 1, 1], [.3, .2, .2]],
  [[.5, .5, .5], [.5, .5, .5], [1, 1, .5], [.8, .9, .3]],
  [[.5, .5, .5], [.5, .5, .5], [1, .7, .4], [0, .15, .2]],
  [[.5, .5, .5], [.5, .5, .5], [2, 1, 0], [.5, .2, .25]],
  [[.8, .5, .4], [.2, .4, .2], [2, 1, 1], [0, .25, .25]],
  [[.55, .4, .6], [.45, .4, .4], [1, 1, 1], [.6, .75, .9]],
  [[.6, .55, .5], [.4, .35, .3], [1, 1, 1], [.05, .2, .35]],
];
function tone(L, x) {
  const P = COSINES[Math.floor(L.h / 360 * COSINES.length) % COSINES.length], d0 = (L.h / 360 * 7) % 1, C = chroma(L.s);
  let v = [0, 1, 2].map(k => P[0][k] + P[1][k] * Math.cos(TAU * (P[2][k] * x + P[3][k] + d0)));
  const Y = .3 * v[0] + .59 * v[1] + .11 * v[2]; v = v.map(u => Y + (u - Y) * C);
  // keep colours readable against the ground: lift on dark, deepen on paper
  const Y2 = .3 * v[0] + .59 * v[1] + .11 * v[2], need = L.light ? Math.max(0, Y2 - .5) * 1.4 : Math.max(0, .45 - Y2) * 1.4;
  const ink = 1 - smooth(.15, .85, L.s);
  return v.map(u => lerp(lerp(u, L.light ? 0 : 1, need), L.light ? .03 : .96, ink));
}
const rgba = (v, a = 1) => `rgba(${v.map(u => Math.round(clamp(u) * 255)).join(',')},${a})`;
// Colors pull toward pure black and white as s falls, and toward a harmonious mid-tone gradient as it rises.
function bg(L, t = 0) { const C = chroma(L.s); return `hsl(${L.h + t * 20 * L.s},${45 * C}%,${lerp(L.light ? 96 : 3, 8, smooth(.15, .85, L.s))}%)`; }
function fg(L, k, t = 0, a = 1) { return rgba(tone(L, k * lerp(.25, .6, L.spread / 160) + t * .03 * L.s), a); }

/* ---------- pictures: family picked by seed, everything else by s ---------- */
// Each make(r, s, look) -> state; draw(c, w, h, t, state). At s=0 each family collapses to one plain shape or line.
const PICS = [
  { name: 'mandala',
    make(r, s, L) { const n = count(s, 14); return { L, segs: 2 * Math.round(lerp(.5, 5, s)), shapes: Array.from({ length: n }, () => ({ d: r(), sp: .3 + r() * .8, ph: r() * TAU, sz: lerp(.16, .05 + r() * .1, s), k: r(), type: Math.floor(r() * 4) })) }; },
    draw(c, w, h, t, st) {
      const L = st.L, s = L.s, cx = w / 2, cy = h / 2, R = Math.hypot(w, h) / 2, m = Math.min(w, h);
      c.fillStyle = bg(L, t); c.fillRect(0, 0, w, h);
      if (st.segs < 2) { c.fillStyle = fg(L, 0, t); const p = st.shapes[0]; shapePath(c, p.type, cx, cy, p.sz * m, t * .1); c.fill(); return; }
      const a = TAU / st.segs;
      for (let k = 0; k < st.segs; k++) {
        c.save(); c.translate(cx, cy);
        if (k % 2) { c.rotate((k + 1) * a + t * .2); c.scale(1, -1); } else c.rotate(k * a + t * .2);
        c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, 0, a + .002); c.closePath(); c.clip();
        for (const p of st.shapes) {
          const d = (.08 + p.d * .85 + .15 * Math.sin(t * p.sp + p.ph)) * R * .9, th = a * (.5 + .45 * Math.sin(t * p.sp * .7 + p.ph * 2));
          c.fillStyle = fg(L, p.k, t, lerp(1, .6, s));
          shapePath(c, p.type, Math.cos(th) * d, Math.sin(th) * d, p.sz * m * (1 + .35 * s * Math.sin(t * 2 * p.sp + p.ph)), t * p.sp); c.fill();
        }
        c.restore();
      }
    } },
  { name: 'rings',
    make(r, s, L) { return { L, sides: [0, 3, 4, 5, 6][Math.floor(r() * 5)], n: count(s, 24), twist: (.05 + r() * .2) * s }; },
    draw(c, w, h, t, st) {
      const L = st.L, s = L.s; c.fillStyle = bg(L, t); c.fillRect(0, 0, w, h);
      const R = Math.hypot(w, h) * .75, N = st.n, base = t * 1.5, fr = N > 1 ? base % 1 : .6, fl = Math.floor(base);

    list.insertBefore(e, sentinel);
    e.addEventListener('click', ev => {
      const b = ev.target.closest('[data-tf]'); if (!b) return;
      if (b.dataset.tf === 'restart') { api.restart(); o.onRestart && o.onRestart(); }
      else { e.remove(); ended = false; topUp(); }
    });
    o.onEnd && o.onEnd(reason);
  }

  // Posts far above the viewport are emptied but keep their height, so the feed stays light without
  // ever moving the scroll position (which would cancel momentum scrolling on phones).
  function trim() {
    if (posts.length < 80) return;
    const drop = posts.slice(0, posts.length - 60).filter(p => !live.has(p));
    for (const p of drop) {
      seenIO.unobserve(p.el); p.el.querySelectorAll('canvas').forEach(c => { c.width = c.height = 0; });
      const h = p.el.offsetHeight;
      p.el.className = 'tf-gone'; p.el.removeAttribute('style'); p.el.removeAttribute('aria-label'); p.el.style.height = `${h}px`;
      p.el.innerHTML = ''; p.el._tf = null;
    }
    posts = posts.filter(p => !drop.includes(p));
  }

  const nextSeed = () => (Math.random() * 2 ** 31) | 0;
  function fill(n) {
    if (ended) return;
    trim();
    for (let i = 0; i < n; i++) {
      if (o.stimAt) gs.s = clamp(o.stimAt());
      const spec = makePost(nextSeed(), gs.s);
      addPost(spec, spec.thread);
      gs.s = Math.max(o.floor, gs.s - o.decay);
      if (spec.thread) {
        const s2 = makePost(nextSeed(), spec.s); s2.avatar = spec.avatar; s2.L = spec.L; s2.thread = false;
        addPost(s2, false); gs.s = Math.max(o.floor, gs.s - o.decay);
      }
    }
  }

  // On-screen canvases redraw at a pace set by their own stimulation; calm ones also redraw less often.
  let last = performance.now(), raf = 0, tick = 0;
  function frame(now) {
    if (!alive) return;
    const dt = clamp((now - last) / 1000, 0, .05); last = now; tick++;
    if (!document.hidden && !reduce) for (const p of live) {
      p.t += dt * p.rate;
      const every = p.rate > .4 ? 1 : p.rate > .15 ? 2 : 4;
      if (tick % every === 0) for (const d of p.draws) d(p.t);
    }
    raf = requestAnimationFrame(frame);
  }

  function reset(s) {
    for (const p of posts) seenIO.unobserve(p.el);
    [...list.children].forEach(c => c !== sentinel && c.remove());
    posts = []; live.clear(); serial = 0; shown = -1; shownLevel = 0; ended = false;
    gs = { s: clamp(s) };
    list.scrollTop = 0; topUp(); updateStim();
  }

  const api = {
    get stim() { return shown; },
    get level() { return shownLevel; },
    // Regenerate everything below what's on screen from stimulation s (e.g. a "Calmer" button or the daily budget).
    setStim(s) {
      s = clamp(s); if (Math.abs(s - gs.s) < 1e-4) return;
      const keep = [...live].reduce((m, p) => Math.max(m, p.idx), -1);
      for (const p of posts.filter(p => p.idx > keep + 1)) { seenIO.unobserve(p.el); p.el.remove(); live.delete(p); }
      posts = posts.filter(p => p.idx <= keep + 1);
      [...list.querySelectorAll('.tf-end')].forEach(d => d.remove());
      ended = false; gs = { s }; topUp();
    },
    setLevel(n) { if (n) api.setStim((n - 1) / 3); },
    setDecay(d) { o.decay = d; },
    end(reason = 'time') {
      const keep = [...live].reduce((m, p) => Math.max(m, p.idx), -1);
      for (const p of posts.filter(p => p.idx > keep + 2)) { seenIO.unobserve(p.el); p.el.remove(); }
      posts = posts.filter(p => p.idx <= keep + 2);
      [...list.querySelectorAll('.tf-end')].forEach(d => d.remove());
      addEnd(reason);
    },
    restart(s = o.stim) { reset(s); },
    destroy() { alive = false; cancelAnimationFrame(raf); seenIO.disconnect(); moreIO.disconnect(); root.innerHTML = ''; },
  };

  reset(o.stim);
  raf = requestAnimationFrame(frame);
  return api;
}

// Single-instance convenience API for the host app.
let cur = null;
window.WaneTextFeed = {
  LEVELS: LV, levelOf, post: makePost,
  mount(el, opts) { if (cur) cur.destroy(); cur = mount(el, opts); return cur; },
  unmount() { if (cur) cur.destroy(); cur = null; },
  setStim(s) { cur && cur.setStim(s); },
  setLevel(n) { cur && cur.setLevel(n); },
  setDecay(d) { cur && cur.setDecay(d); },
  end(reason) { cur && cur.end(reason); },
  restart(s) { cur && cur.restart(s); },
  get stim() { return cur ? cur.stim : 0; },
  get level() { return cur ? cur.level : 0; },
};
})();

</script>
