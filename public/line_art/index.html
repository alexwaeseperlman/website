<!DOCTYPE html>
<html>

<head>
    <title>Line art</title>
</head>

<body>
    Image upload:
    <input type="file" id="file" />
    Nodes: <input type="number" id="nodes" value="170" min="20" max="600" style="width: 60px" />
    <br />
    <canvas id="canvas"></canvas>
    <img id="line-art-image" style="display:none;" alt="" />
</body>
<script type="module">
    import { lineArt, drawGraph } from './line_art.js';
    let worker = null;
    const fileInput = document.getElementById("file");
    const nodesInput = document.getElementById("nodes");
    const lineArtImage = document.getElementById("line-art-image");
    const canvas = document.getElementById("canvas");
    fileInput.addEventListener("change", (e) => {
        lineArtImage.src = URL.createObjectURL(e.target.files[0]);
    });
    nodesInput.addEventListener("change", () => lineArtImage.src && lineArtImage.onload());

    lineArtImage.onload = () => {
        if (worker) worker.terminate();
        const width = lineArtImage.naturalWidth, height = lineArtImage.naturalHeight;
        [worker] = lineArt(lineArtImage, (nodes, edges, ink) => {
            drawGraph(canvas, width, height, nodes, edges, ink);
        }, { nodes: +nodesInput.value });
    };
</script>

</html>
