<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5fafd; --card:#ffffff; --ink:#1a1a1a; --blue:#3f75ad; --border:#e1e8ee;
  --field:#f5fafd; --grey:#707070; --outline:#1a1a1a; --sel:#3d8fe8;
  --red:#d64541; --green:#2e9e6b; --gold:#e0a100;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0f1720; --card:#16202b; --ink:#e8edf2; --blue:#7fb0e3; --border:#26323f; --field:#0f1720; --grey:#9aa4ae; --outline:#c9d2db; --sel:#5aa9f5; --red:#ef6b66; --green:#4cc08b; --gold:#f2bb2e; }
}
:root[data-theme="dark"]{ --bg:#0f1720; --card:#16202b; --ink:#e8edf2; --blue:#7fb0e3; --border:#26323f; --field:#0f1720; --grey:#9aa4ae; --outline:#c9d2db; --sel:#5aa9f5; --red:#ef6b66; --green:#4cc08b; --gold:#f2bb2e; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Roboto Slab",Rockwell,Georgia,serif; font-size:16px; line-height:1.4;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
h1{margin:0;font-weight:400;text-transform:uppercase;color:var(--blue);font-size:22px;line-height:1.2;flex:1}
.hint{padding:4px 16px 0;color:var(--grey);font-size:15px;min-height:2.8em}
.hint b{color:var(--blue);font-weight:600}
button{
  font:inherit; font-size:15px; color:var(--ink); background:var(--field);
  border:2px solid var(--outline); border-radius:8px; padding:6px 12px; cursor:pointer;
}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.3;cursor:default}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--card);font-weight:600}
.icon-btn{padding:6px 8px;line-height:0}
#board{flex:1;min-height:0;position:relative}
#board canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none}
#stage{touch-action:none}
button,.tile{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.seg{display:flex;border:2px solid var(--outline);border-radius:8px;overflow:hidden;margin-top:6px}
.seg button{flex:1;border:0;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--card);font-weight:600}
.dock{background:var(--card);border:2px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;padding:12px 14px 14px}
.status{font-weight:600;color:var(--blue);min-height:1.4em}
.row{display:flex;gap:8px;align-items:center}
.preview{margin-top:10px}
.preview[hidden]{display:none}
.preview .opt{flex:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--grey);font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tool{
  position:relative; width:58px; height:58px; padding:0; border-radius:12px;
  display:flex; align-items:center; justify-content:center; border-color:var(--border);
  transition:transform .15s ease, border-color .2s ease, background .2s ease;
}
.tool svg{width:40px;height:40px;overflow:visible}
.tool:not(:disabled){border-color:var(--sel);background:color-mix(in srgb, var(--sel) 10%, var(--card))}
.tool:not(:disabled):active{transform:scale(.92)}
.tool.armed{background:var(--sel);border-color:var(--sel)}
.tool.armed svg *{stroke:var(--card)!important}
.tool.armed svg .fill{fill:var(--card)!important}
.tool.armed svg text{fill:var(--card)!important}
.tool:disabled{opacity:.35}
.tool .badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--card);font-size:12px;font-weight:700;line-height:22px;text-align:center;padding:0 5px}
.tool.new{animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sel) 0%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--sel) 30%,transparent)}}
@media (prefers-reduced-motion: reduce){ .tool.new{animation:none} .tool{transition:none} }
.meta-row{margin-top:12px}
.hintbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:14px;color:var(--grey)}
.hintbar[hidden]{display:none}
.chip{min-width:28px;padding:2px 8px;border-radius:12px;border:2px solid var(--border);text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--field)}
.chip.done{opacity:.4}
.chip.now{border-color:var(--sel);color:var(--sel);font-weight:700}
.meta{flex:1;color:var(--grey);font-size:15px;font-variant-numeric:tabular-nums}
.solved-row{margin-top:10px}
.solved-row[hidden]{display:none}
.solved-row button{flex:1}
.hcard{border:2px solid var(--border);border-radius:8px;padding:12px;margin-top:10px}
.hcard .hh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hcard .ht{font-weight:600;color:var(--blue);font-size:15px}
.hcard .hs{font-size:13px;color:var(--grey);white-space:nowrap;flex-shrink:0}
.hcard .reveal{flex-shrink:0}
.hcard .hb{margin-top:10px;color:var(--ink);font-size:15px}
.hcard .hd{font-size:13px;color:var(--grey);margin-top:2px}
.hcard.seen{border-color:var(--blue)}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{border:1.5px solid var(--border);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.hshapes{display:flex;flex-wrap:wrap;gap:10px}
.hshape{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--grey)}
.hshape canvas{width:76px;height:76px;border:1.5px solid var(--border);border-radius:6px}
.sheet{position:fixed;inset:0;background:rgba(15,23,32,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.sheet .inner{
  background:var(--card);border:2px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;
  width:100%;max-width:560px;max-height:82%;overflow:auto;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));
}
.sheet h2{margin:0 0 4px;font-weight:400;text-transform:uppercase;color:var(--blue);font-size:20px}
.sheet h3{margin:16px 0 8px;font-size:15px;font-weight:600;color:var(--blue)}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.total{font-size:15px;color:var(--grey);font-variant-numeric:tabular-nums}
.total b{color:var(--ink);font-weight:700}
.chapter{margin-top:20px}
.ch-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ch-head h3{margin:0;font-size:17px;font-weight:600;color:var(--blue)}
.ch-head .count{font-size:14px;color:var(--grey);font-variant-numeric:tabular-nums;white-space:nowrap}
.ch-desc{font-size:14px;color:var(--grey);margin:2px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border:2px solid var(--border);border-radius:10px;background:var(--field)}
.tile.cur{border-color:var(--blue)}
.tile svg.thumb{width:100%;max-width:52px;aspect-ratio:1;display:block}
.tile .num{font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums;line-height:1}
.stars{display:flex;gap:1px;font-size:13px;line-height:1;letter-spacing:0}
.star{color:var(--border)}
.star.on{color:var(--gold)}
.pill{padding:5px 10px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .star{color:var(--gold)}
.earned{display:inline-flex;gap:2px;margin-right:6px;vertical-align:-1px}
.earned .star{display:inline-block;transform:scale(0);animation:starpop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.earned .star:nth-child(2){animation-delay:.22s}
@keyframes starpop{to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){ .earned .star{animation:none;transform:none} }
#levelBtn{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- screens: home and level picker sit over the game */
.screen{position:fixed;inset:0;z-index:4;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.screen.on{display:flex}
#home{align-items:center;justify-content:center}
.home-inner{width:100%;max-width:380px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:150px;height:150px;margin-bottom:8px}
.logo .spin{transform-origin:50px 50px;animation:logospin 6s cubic-bezier(.6,0,.25,1) infinite}
@keyframes logospin{0%,12%{transform:rotate(0)}25%,37%{transform:rotate(-90deg)}50%,62%{transform:rotate(-180deg)}75%,87%{transform:rotate(-270deg)}100%{transform:rotate(-360deg)}}
@media (prefers-reduced-motion: reduce){ .logo .spin{animation:none} }
.home-title{flex:none;font-size:44px;letter-spacing:.06em;margin:0}
.tagline{color:var(--grey);margin:4px 0 28px}
.home-btns{display:flex;flex-direction:column;gap:12px;width:100%}
.big{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 18px;font-size:18px;border-radius:12px;text-align:left}
.big small{display:block;font-size:14px;font-weight:400;opacity:.85}
.big .go{font-size:24px;line-height:1}
.big .pill-ish{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.home-foot{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px;color:var(--grey);font-size:14px}
.page-head{position:sticky;top:0;z-index:1;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--border)}
.page-head h2{flex:1;margin:0;font-weight:400;text-transform:uppercase;color:var(--blue);font-size:22px;line-height:1.2}
.tile.locked{cursor:default}
.tile.locked svg.thumb{opacity:.3}
.tile.locked .num{opacity:.6}
.lock{width:12px;height:12px;color:var(--grey);vertical-align:-1px}
.ch-head h3 .lock{width:15px;height:15px;margin-right:6px;vertical-align:-2px}
.chapter.locked .ch-head h3{color:var(--grey)}
.page-body{width:100%;max-width:560px;margin:0 auto;padding:0 14px 24px}
</style>

/* ================= geometry (mirrors the solver) ================= */
const keyOf = p => (Math.round(p[0]*1000)/1000) + ',' + (Math.round(p[1]*1000)/1000);
function centroid(P, idx){ let x=0,y=0; for (const i of idx){ x+=P[i][0]; y+=P[i][1]; } return [x/idx.length, y/idx.length]; }
function rotP(p,c,th){ const x=p[0]-c[0], y=p[1]-c[1], cs=Math.cos(th), sn=Math.sin(th); return [x*cs-y*sn+c[0], x*sn+y*cs+c[1]]; }

function rotPerm(P, idx, deg){
  if (idx.length < 3) return null;
  const c = centroid(P, idx), th = deg*Math.PI/180, perm = {};
  for (const i of idx){ const j = findIn(P, idx, rotP(P[i], c, th)); if (j < 0) return null; perm[i] = j; }
  if (idx.every(i => perm[i] === i)) return null;

}
function mirrorAxes(P, idx){
  if (idx.length < 3) return [];
  const c = centroid(P, idx), cands = [];

    cands.push((((Math.atan2(B[1]-A[1],B[0]-A[0])+Math.PI/2)%Math.PI)+Math.PI)%Math.PI);
  }
  cands.sort((a,b)=>a-b);

  for (const phi of cands){
    if (out.some(o => Math.abs(phi-o.phi) < 1e-3 || Math.abs(Math.abs(phi-o.phi)-Math.PI) < 1e-3)) continue;
    const perm = {}; let ok = true;
    for (const i of idx){ const j = findIn(P, idx, reflP(P[i], c, phi)); if (j < 0){ ok=false; break; } perm[i] = j; }
    if (ok && !idx.every(i => perm[i] === i)) out.push({ phi, c, perm });

}
function completions(P, idx, tools, budget){
  if (idx.length < 2 || budget <= 0) return [];
  const S = idx.map(i => P[i]), allk = new Set(P.map(keyOf)), Sk = new Set(S.map(keyOf));
  const res = new Map();
  const closure = gen => {
    const cur = S.slice(), seen = new Set(Sk); let changed = true;
    while (changed){
      changed = false;
      for (const p of cur.slice()){
        const q = gen(p), k = keyOf(q);
        if (!seen.has(k)){ seen.add(k); cur.push(q); changed = true; if (cur.length - S.length > budget) return null; }
      }
    }
    return cur.filter(p => !Sk.has(keyOf(p)));
  };
  const add = (pts, info) => {
    if (!pts || !pts.length) return;
    const ks = pts.map(keyOf).sort();
    if (ks.some(k => allk.has(k))) return;
    const id = ks.join('|');
    if (!res.has(id)) res.set(id, { pts, info });
  };
  const angles = [];
  for (const t of tools){ if (t in ROT) angles.push(ROT[t]); if (t in MINROT) angles.push(...ADD_ANGLES); }
  const rotList = [...new Set(angles)];
  for (const t of [...rotList, ...tools.filter(x => x === 'm')]){
    if (t !== 'm'){
      const base = t*Math.PI/180, order = Math.round(360/Math.abs(t));
      for (let k=1;k<order;k++){
        const th = base*k, c_ = Math.cos(th), s_ = Math.sin(th);
        for (let a=0;a<S.length;a++) for (let b=0;b<S.length;b++){
          if (a === b) continue;
          const A = S[a], B = S[b];
          const vx = B[0]-(A[0]*c_-A[1]*s_), vy = B[1]-(A[0]*s_+A[1]*c_);
          const m00=1-c_, m01=s_, m10=-s_, m11=1-c_, det = m00*m11-m01*m10;
          if (Math.abs(det) < 1e-9) continue;
          const cx = (m11*vx-m01*vy)/det, cy = (-m10*vx+m00*vy)/det;
          add(closure(p => rotP(p,[cx,cy],base)), { kind:'rot', c:[cx,cy] });
        }

    }
    if (t === 'm'){
      for (let a=0;a<S.length;a++) for (let b=a+1;b<S.length;b++){
        const A=S[a], B=S[b], mid=[(A[0]+B[0])/2,(A[1]+B[1])/2], ang=Math.atan2(B[1]-A[1],B[0]-A[0]);
        add(closure(p => reflP(p,mid,ang+Math.PI/2)), { kind:'m', c:mid, phi:ang+Math.PI/2 });

  const [cx, cy] = centroid(P, idx);

    Math.max(...u.pts.map(p=>Math.hypot(p[0]-cx,p[1]-cy))) - Math.max(...v.pts.map(p=>Math.hypot(p[0]-cx,p[1]-cy))));
}
function minRot(P, idx, sign){ const n = rotOrder(P, idx); return n ? rotPerm(P, idx, sign*360/n) : null; }

  const c = centroid(P, idx), off = idx.filter(i => Math.hypot(P[i][0]-c[0],P[i][1]-c[1]) > EPS).length;
  for (let n = off; n >= 2; n--){ if (off % n) continue; if (rotPerm(P, idx, 360/n)) return n; }

}

  const large = sweep > 180 ? 1 : 0, sw = ccw ? 0 : 1;
  const tang = ccw ? end + 90 : end - 90;
  const ah = (off) => { const d = (tang + off)*Math.PI/180; return [x1 - 6*Math.cos(d), y1 + 6*Math.sin(d)]; };

    <path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} ${sw} ${x1.toFixed(1)} ${y1.toFixed(1)}"/>
    <path d="M${ax.toFixed(1)} ${ay.toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)} L${bx.toFixed(1)} ${by.toFixed(1)}"/>
    <text x="20" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" stroke="none" font-family="Roboto Slab, Georgia, serif">${label === undefined ? a : label}</text></svg>`;
}

function solFrames(lv){
  if (!lv.sol) return null;
  let pts = lv.pts.map(p => p.slice()), lk = (lv.links||[]).map(l => l.slice()), ar = (lv.arrows||[]).map(l => l.slice()), cols = lv.start.slice();
  const frames = [];
  for (const mv of lv.sol){
    frames.push({ pts: pts.slice(), links: lk.map(l => l.slice()), arrows: ar.map(l => l.slice()), sel: mv.s, t: mv.t });
    let r = null;
    if (mv.t === 'add'){ pts = pts.concat(mv.add.map(q => q.slice())); cols = cols.concat(mv.add.map(() => null)); continue; }
    if (mv.t in MINROT) r = minRot(pts, mv.s, MINROT[mv.t]);
    else if (mv.t in ROT) r = rotPerm(pts, mv.s, ROT[mv.t]);
    else if (mv.t === 'm') r = mirrorAxes(pts, mv.s).find(a => { const d = Math.abs(((a.phi - mv.phi) % Math.PI + Math.PI) % Math.PI); return d < 1e-3 || Math.PI - d < 1e-3; });
    if (!r) return null;
    const pm = i => r.perm[i] === undefined ? i : r.perm[i], nc = cols.slice();

    cols = nc; lk = lk.map(([a,b]) => [pm(a), pm(b)]); ar = ar.map(([a,b]) => [pm(a), pm(b)]);
  }

}

    wrap.append(cv); const lab = document.createElement('span');

function thumb(lv){
  // tiny preview: dots, links/arrows, goal rings
  const xs = lv.pts.map(p=>p[0]), ys = lv.pts.map(p=>p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const s = 30/Math.max(maxX-minX, maxY-minY, 1e-6), ox = 20 - s*(minX+maxX)/2, oy = 20 + s*(minY+maxY)/2;
  const X = x => (ox + x*s).toFixed(1), Y = y => (oy - y*s).toFixed(1);
  const col = { r:'var(--red)', g:'var(--green)', y:'var(--gold)' };
  let o = '';
  // construction guides, same geometry and tick counts as on the board
  const g = computeGuides(lv.pts, lv.name === 'Lattice'), gs = 'stroke="var(--grey)" fill="none" stroke-linecap="round"';
  if (g && g.lines) for (const [a,b] of g.lines)
    o += `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" ${gs} stroke-opacity=".4" stroke-width=".45"/>`;
  if (g && g.polys){
    const sizes = [...new Set(g.polys.map(q => q.v.length))].sort((a,b) => a-b);
    for (const pg of g.polys){
      const cx = +X(pg.c[0]), cy = +Y(pg.c[1]), R = pg.r*s, n = pg.v.length, ticks = sizes.indexOf(n)+1;
      o += `<circle cx="${cx}" cy="${cy}" r="${R.toFixed(2)}" ${gs} stroke-opacity=".45" stroke-width=".4" stroke-dasharray="1 1.3"/>`;
      const angs = pg.v.map(v => Math.atan2(+Y(v[1])-cy, +X(v[0])-cx)).sort((a,b) => a-b);
      for (const a of angs) o += `<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*R).toFixed(2)}" y2="${(cy+Math.sin(a)*R).toFixed(2)}" ${gs} stroke-opacity=".35" stroke-width=".35"/>`;
      const ar = Math.min(R*.32, 3.4), gap = Math.min(.2, Math.PI/n*.35), pt = (a,r) => `${(cx+Math.cos(a)*r).toFixed(2)} ${(cy+Math.sin(a)*r).toFixed(2)}`;
      for (let i=0;i<n;i++){
        const a0 = angs[i]+gap, a1 = (i+1<n ? angs[i+1] : angs[0]+TAU)-gap, m = (angs[i] + (i+1<n ? angs[i+1] : angs[0]+TAU))/2;
        o += `<path d="M${pt(a0,ar)} A${ar.toFixed(2)} ${ar.toFixed(2)} 0 0 1 ${pt(a1,ar)}" ${gs} stroke-opacity=".55" stroke-width=".35"/>`;
        for (let t=0;t<ticks;t++){ const tm = m + (t-(ticks-1)/2)*(.7/ar);
          o += `<path d="M${pt(tm,ar-.7)} L${pt(tm,ar+.7)}" ${gs} stroke-opacity=".55" stroke-width=".35"/>`; }
      }
    }
  }
  if (g && g.pairs) for (const pr of g.pairs){
    for (const [a,b] of pr.segs) o += `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" ${gs} stroke-opacity=".45" stroke-width=".4" stroke-dasharray="1 1.3"/>`;
    o += `<circle cx="${X(pr.c[0])}" cy="${Y(pr.c[1])}" r=".6" fill="var(--grey)" fill-opacity=".6"/>`;
  }
  for (const [a,b] of (lv.links||[])){
    const cc = bowCtrl(lv.pts[a], lv.pts[b], lv.pts);
    o += `<path d="M${X(lv.pts[a][0])} ${Y(lv.pts[a][1])} Q${X(cc[0])} ${Y(cc[1])} ${X(lv.pts[b][0])} ${Y(lv.pts[b][1])}" fill="none" stroke="var(--grey)" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  for (const [a,b] of (lv.arrows||[])){
    // bar that stops short of the head, then a filled head just outside the target dot
    const cc = bowCtrl(lv.pts[a], lv.pts[b], lv.pts), qx = +X(cc[0]), qy = +Y(cc[1]);
    const ax = +X(lv.pts[a][0]), ay = +Y(lv.pts[a][1]), bx = +X(lv.pts[b][0]), by = +Y(lv.pts[b][1]);
    const len = Math.hypot(bx-qx, by-qy) || 1, ux = (bx-qx)/len, uy = (by-qy)/len;
    const tx = bx - ux*2.6, ty = by - uy*2.6, hl = 2.8, hw = 1.8, f = v => v.toFixed(2);
    o += `<path d="M${f(ax)} ${f(ay)} Q${f(qx)} ${f(qy)} ${f(tx-ux*hl*.8)} ${f(ty-uy*hl*.8)}" fill="none" stroke="var(--grey)" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>`;
    o += `<path d="M${f(tx)} ${f(ty)} L${f(tx-ux*hl-uy*hw)} ${f(ty-uy*hl+ux*hw)} L${f(tx-ux*hl+uy*hw)} ${f(ty-uy*hl-ux*hw)}Z" fill="var(--grey)" fill-opacity=".75"/>`;
  }
  for (const [i,c] of lv.goal) o += `<circle cx="${X(lv.pts[i][0])}" cy="${Y(lv.pts[i][1])}" r="3.6" fill="none" stroke="${col[c]}" stroke-width="1.3"/>`;

        ctx.beginPath(); ctx.moveTo(cx+Math.cos(tm)*(ar-3.5), cy+Math.sin(tm)*(ar-3.5)); ctx.lineTo(cx+Math.cos(tm)*(ar+3.5), cy+Math.sin(tm)*(ar+3.5)); ctx.stroke();
      }
    }
    ctx.globalAlpha = .3; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, 1.6, 0, TAU); ctx.fill();
  }
  // half turns: every pair is split evenly by the centre, shown with matching ticks on both halves
  for (const pr of (g.pairs || [])){
    const lens = [...new Set(pr.segs.map(([a,b]) => Math.hypot(a[0]-b[0], a[1]-b[1]).toFixed(3)))].sort();
    ctx.globalAlpha = .28; ctx.lineWidth = 1; ctx.setLineDash([3,4]);
    for (const [a,b] of pr.segs){ ctx.beginPath(); ctx.moveTo(X(a[0]),Y(a[1])); ctx.lineTo(X(b[0]),Y(b[1])); ctx.stroke(); }
    ctx.setLineDash([]); ctx.globalAlpha = .4;
    for (const [a,b] of pr.segs){
      const ticks = Math.min(3, lens.indexOf(Math.hypot(a[0]-b[0], a[1]-b[1]).toFixed(3)) + 1);
      const ax = X(a[0]), ay = Y(a[1]), bx = X(b[0]), by = Y(b[1]), L = Math.hypot(bx-ax, by-ay) || 1, ux = (bx-ax)/L, uy = (by-ay)/L;
      for (const f of [.25, .75]){
        const mx = ax + (bx-ax)*f, my = ay + (by-ay)*f;
        for (let t=0;t<ticks;t++){ const o = (t-(ticks-1)/2)*3.2, px = mx+ux*o, py = my+uy*o;

    }
    ctx.globalAlpha = .35; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(pr.c[0]), Y(pr.c[1]), 2, 0, TAU); ctx.fill();
  }

}

// links/arrows bow sideways when a dot sits on (or near) the straight line, so they never look like they end there
let mdCache = { n:-1, md:1 };
function minSpacing(pts){
  if (pts === P && mdCache.n === P.length) return mdCache.md;
  let md = Infinity; for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++) md = Math.min(md, Math.hypot(pts[i][0]-pts[j][0], pts[i][1]-pts[j][1]));
  if (!isFinite(md)) md = 1;
  if (pts === P) mdCache = { n:P.length, md };
  return md;
}
function bowCtrl(pa, pb, pts){
  const dx = pb[0]-pa[0], dy = pb[1]-pa[1], len = Math.hypot(dx, dy) || 1, nx = -dy/len, ny = dx/len;
  const md = minSpacing(pts); let w = 0;
  for (const q of pts){
    const qx = q[0]-pa[0], qy = q[1]-pa[1], t = (qx*dx+qy*dy)/(len*len);
    if (t < .08 || t > .92) continue;
    w = Math.max(w, 1 - Math.abs(qx*nx+qy*ny)/(.3*md));
  }
  const h = Math.min(.45*md, .22*len) * Math.max(0, w);
  return [(pa[0]+pb[0])/2 + nx*h, (pa[1]+pb[1])/2 + ny*h];
}

// ---- board graph: Delaunay triangulation, cocircular faces merged (squares stay squares), long hull edges pruned
let graphCache = { key:'', E:[], F:[] };
function circum(a,b,c){ const d = 2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));
  if (Math.abs(d) < 1e-12) return [0,0,Infinity];
  const A=a[0]*a[0]+a[1]*a[1], B=b[0]*b[0]+b[1]*b[1], C=c[0]*c[0]+c[1]*c[1];
  const ux=(A*(b[1]-c[1])+B*(c[1]-a[1])+C*(a[1]-b[1]))/d, uy=(A*(c[0]-b[0])+B*(a[0]-c[0])+C*(b[0]-a[0]))/d;
  return [ux,uy,Math.hypot(a[0]-ux,a[1]-uy)]; }
function boardGraph(pts){
  const key = pts.length + ':' + pts.map(p => p[0].toFixed(3)+','+p[1].toFixed(3)).join(';');
  if (graphCache.key === key) return graphCache;
  const n = pts.length, A = pts.concat([[-1e4,-1e4],[1e4,-1e4],[0,1e4]]); let T = [[n,n+1,n+2]];
  for (let i=0;i<n;i++){
    const p = A[i], bad = [], keep = [];
    for (const t of T){ const c = circum(A[t[0]],A[t[1]],A[t[2]]); (Math.hypot(p[0]-c[0],p[1]-c[1]) < c[2]-1e-9 ? bad : keep).push(t); }
    const cnt = new Map(), ek = (u,v) => Math.min(u,v)+','+Math.max(u,v);
    for (const t of bad) for (const [u,v] of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]) cnt.set(ek(u,v),(cnt.get(ek(u,v))||0)+1);
    for (const t of bad) for (const [u,v] of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]) if (cnt.get(ek(u,v)) === 1) keep.push([u,v,i]);
    T = keep;
  }
  let faces = T.filter(t => t.every(v => v < n));
  const ek = (u,v) => Math.min(u,v)+','+Math.max(u,v);
  const onC = (f,c) => f.every(v => Math.abs(Math.hypot(pts[v][0]-c[0],pts[v][1]-c[1]) - c[2]) < 1e-4);
  for (let merged = true; merged;){
    merged = false;
    outer: for (let a=0;a<faces.length;a++) for (let b=a+1;b<faces.length;b++){
      const fa = faces[a], fb = faces[b]; if (fa.filter(v => fb.includes(v)).length !== 2) continue;
      const c = circum(pts[fa[0]],pts[fa[1]],pts[fa[2]]); if (!onC(fa,c) || !onC(fb,c)) continue;
      const vs = [...new Set(fa.concat(fb))], cx = vs.reduce((s,v)=>s+pts[v][0],0)/vs.length, cy = vs.reduce((s,v)=>s+pts[v][1],0)/vs.length;
      vs.sort((u,v) => Math.atan2(pts[u][1]-cy,pts[u][0]-cx) - Math.atan2(pts[v][1]-cy,pts[v][0]-cx));
      faces.splice(b,1); faces[a] = vs; merged = true; break outer;
    }
  }
  const md = minSpacing(pts), es = new Map();
  for (const f of faces) for (let k=0;k<f.length;k++){ const u = f[k], v = f[(k+1)%f.length]; es.set(ek(u,v),[u,v]); }
  const E = [...es.values()].filter(([u,v]) => Math.hypot(pts[u][0]-pts[v][0],pts[u][1]-pts[v][1]) <= 2.05*md);
  const eset = new Set(E.map(([u,v]) => ek(u,v)));
  const F = faces.filter(f => f.every((u,k) => eset.has(ek(u,f[(k+1)%f.length]))));
  graphCache = { key, E, F }; return graphCache;
}
// ---- selection: disks on selected dots, bars on edges with both ends selected, filled faces; one merged shape
const selFill = document.createElement('canvas'), selRing = document.createElement('canvas');
function drawSelection(gooPos, X, Y, mdPx, col, conn){   // conn: [a, b, pa, pb, ctrl] links/arrows in world coords
  const W = stage.width, H = stage.height, dpr = W / stage.clientWidth;
  for (const c of [selFill, selRing]) if (c.width !== W || c.height !== H){ c.width = W; c.height = H; }
  const live = []; for (let i=0;i<P.length;i++) if (selAmt[i] > .02) live.push(i);
  if (!live.length) return;
  const amt = i => Math.min(1.15, Math.max(0, selAmt[i]));
  const { E, F } = boardGraph(P), R = mdPx*.3, Rb = mdPx*.17;
  const SE = E.filter(([u,v]) => selAmt[u] > .02 && selAmt[v] > .02);
  const SF = F.filter(f => f.every(v => selAmt[v] > .02));
  const shapes = (g, grow) => {
    g.setTransform(dpr,0,0,dpr,0,0); g.fillStyle = g.strokeStyle = col; g.lineCap = 'round';
    for (const i of live){ const p = gooPos(i); g.beginPath(); g.arc(X(p[0]), Y(p[1]), Math.max(0, R*amt(i)) + grow, 0, TAU); g.fill(); }
    for (const [u,v] of SE){ const a = gooPos(u), b = gooPos(v), w = Rb*Math.min(amt(u), amt(v));
      g.lineWidth = 2*(w + grow); g.beginPath(); g.moveTo(X(a[0]),Y(a[1])); g.lineTo(X(b[0]),Y(b[1])); g.stroke(); }
    for (const [a,b,pa,pb,cc] of (conn||[])){ if (selAmt[a] <= .02 || selAmt[b] <= .02) continue;
      const w = Rb*Math.min(amt(a), amt(b)); g.lineWidth = 2*(w + grow);
      g.beginPath(); g.moveTo(X(pa[0]),Y(pa[1])); g.quadraticCurveTo(X(cc[0]),Y(cc[1]),X(pb[0]),Y(pb[1])); g.stroke(); }
    for (const f of SF){ const m = Math.min(...f.map(amt)), q = f.map(gooPos);
      const cx = q.reduce((s,p)=>s+X(p[0]),0)/q.length, cy = q.reduce((s,p)=>s+Y(p[1]),0)/q.length;
      g.beginPath(); q.forEach((p,k) => { const x = cx + (X(p[0])-cx)*Math.min(1,m), y = cy + (Y(p[1])-cy)*Math.min(1,m); k ? g.lineTo(x,y) : g.moveTo(x,y); });
      g.closePath(); g.fill(); if (grow){ g.lineWidth = 2*grow; g.lineJoin = 'round'; g.stroke(); } }
  };
  const fc = selFill.getContext('2d'), rc = selRing.getContext('2d');
  fc.setTransform(1,0,0,1,0,0); fc.clearRect(0,0,W,H); shapes(fc, 0);
  rc.setTransform(1,0,0,1,0,0); rc.clearRect(0,0,W,H); shapes(rc, 2);
  rc.setTransform(1,0,0,1,0,0); rc.globalCompositeOperation = 'destination-out'; rc.drawImage(selFill, 0, 0); rc.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = .2; ctx.drawImage(selFill, 0, 0);
  ctx.globalAlpha = .9; ctx.drawImage(selRing, 0, 0);
  ctx.restore();
}
function mixHex(a, b, t){ const A = hexRGB(a), B = hexRGB(b); const c = A.map((v,k) => Math.round(v + (B[k]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`; }
function drawFrame(now){
  if (preview && !(opts[preview.tool] && opts[preview.tool][preview.k])) preview = null;
  const dt = Math.min(.05, (now-last)/1000); last = now;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if (!L || !W) return;

  const tv = targetView();
  if (!view.s) Object.assign(view, tv);
  const kk = 1 - Math.exp(-dt*9);
  view.s += (tv.s-view.s)*kk; view.ox += (tv.ox-view.ox)*kk; view.oy += (tv.oy-view.oy)*kk; view.md = tv.md;
  const X = x => view.ox + x*view.s, Y = y => view.oy - y*view.s;
  const dot = Math.max(9, Math.min(16, view.md*view.s*0.16));
  const PAL = { r:css('--red'), g:css('--green'), y:css('--gold') };
  const ink = css('--ink'), border = css('--border'), grey = css('--grey'), selC = css('--sel');

  let k = 1;
  if (anim){ k = Math.min(1, (now-anim.t0)/anim.dur); }
  drawGuides(X, Y, grey);

  // selection springs
  const stiff = 260, damp = 18;
  for (let i=0;i<P.length;i++){
    const tgt = sel.has(i) ? 1 : 0;
    selVel[i] += ((tgt - selAmt[i])*stiff - selVel[i]*damp)*dt;
    selAmt[i] += selVel[i]*dt;
  }
  const fit = sel.size >= 3 && anyFit();
  spokeAmt += ((fit ? 1 : 0) - spokeAmt)*(1-Math.exp(-dt*(fit?7:14)));

  // links
  ctx.lineCap = 'round';
  for (const [a,b] of (anim ? anim.links : links)){
    const pa = tokenPos(a, k), pb = tokenPos(b, k), cc = bowCtrl(pa, pb, P);
    ctx.strokeStyle = ink; ctx.globalAlpha = .28; ctx.lineWidth = dot*.55;
    ctx.beginPath(); ctx.moveTo(X(pa[0]),Y(pa[1])); ctx.quadraticCurveTo(X(cc[0]),Y(cc[1]),X(pb[0]),Y(pb[1])); ctx.stroke();
  }
  for (const [a,b] of (anim ? anim.arrows : arrows)){
    const pa = tokenPos(a, k), pb = tokenPos(b, k), cc = bowCtrl(pa, pb, P);
    const ax = X(pa[0]), ay = Y(pa[1]), bx = X(pb[0]), by = Y(pb[1]), cx = X(cc[0]), cy = Y(cc[1]);
    const len = Math.hypot(bx-cx, by-cy) || 1, ux = (bx-cx)/len, uy = (by-cy)/len;   // head follows the curve's end tangent
    const tipX = bx - ux*dot*1.35, tipY = by - uy*dot*1.35, hw = dot*.75, hl = dot*1.25;
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.globalAlpha = .28; ctx.lineWidth = dot*.55;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(cx, cy, tipX - ux*hl*.6, tipY - uy*hl*.6); ctx.stroke();
    ctx.globalAlpha = .45;
    ctx.beginPath(); ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - ux*hl - uy*hw, tipY - uy*hl + ux*hw);
    ctx.lineTo(tipX - ux*hl + uy*hw, tipY - uy*hl - ux*hw); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // selection effect
  const idx = selIdx();
  const center = idx.length ? centroid(P, idx) : null;
  const gooPos = i => (anim && anim.kind === 'rot' && anim.idx.has(i)) ? rotP(P[i], anim.c, (anim.a0||0)*(1-ease(k)) + anim.ang*ease(k)) : P[i];
  const mdPx = view.md*view.s;
  const selCol = mixHex(grey, selC, Math.max(0, Math.min(1, spokeAmt)));
  const conn = [];
  for (const [a,b] of (anim ? anim.links : links).concat(anim ? anim.arrows : arrows)){
    const pa = tokenPos(a, k), pb = tokenPos(b, k); conn.push([a, b, pa, pb, bowCtrl(pa, pb, P)]); }
  drawSelection(gooPos, X, Y, mdPx, selCol, conn);
  if (center && spokeAmt > .02 && !preview){   // dashed spokes from the turning centre
    ctx.save(); ctx.strokeStyle = selCol; ctx.globalAlpha = .55*spokeAmt; ctx.lineWidth = 1.3; ctx.setLineDash([3,4]);
    for (const i of idx){ const p = gooPos(i); ctx.beginPath(); ctx.moveTo(X(center[0]),Y(center[1])); ctx.lineTo(X(p[0]),Y(p[1])); ctx.stroke(); }
    ctx.restore();
  }
  const hollowAt = (center && spokeAmt > .3) ? P.findIndex((p,i) => !sel.has(i) && Math.hypot(p[0]-center[0], p[1]-center[1]) < 1e-3) : -1;

  // preview ghosts
  if (preview){
    const o = opts[preview.tool][preview.k];
    ctx.setLineDash([6,6]); ctx.strokeStyle = selC; ctx.lineWidth = 2;
    if (preview.tool === 'm'){
      const ux = Math.cos(o.phi), uy = Math.sin(o.phi), Lx = 1e3;
      ctx.beginPath(); ctx.moveTo(X(o.c[0]-ux*Lx), Y(o.c[1]-uy*Lx)); ctx.lineTo(X(o.c[0]+ux*Lx), Y(o.c[1]+uy*Lx)); ctx.stroke();
      ctx.setLineDash([]);
      for (const i in o.perm){ const j = o.perm[i], c = colors[+i]; if (!c || +i === j) continue;
        ctx.globalAlpha = .4; ctx.fillStyle = PAL[c]; ctx.beginPath(); ctx.arc(X(P[j][0]),Y(P[j][1]),dot*1.25,0,TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
    } else {
      const pulse = 1 + .08*Math.sin(now/180);
      for (const p of o.pts){ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),dot*pulse,0,TAU); ctx.stroke(); }
      ctx.setLineDash([]);
      if (o.info.kind === 'rot'){ ctx.fillStyle = selC; ctx.beginPath(); ctx.arc(X(o.info.c[0]),Y(o.info.c[1]),3.5,0,TAU); ctx.fill(); }
      else {
        const ux = Math.cos(o.info.phi), uy = Math.sin(o.info.phi), Lx = 1e3;
        ctx.globalAlpha = .5; ctx.setLineDash([3,7]);
        ctx.beginPath(); ctx.moveTo(X(o.info.c[0]-ux*Lx), Y(o.info.c[1]-uy*Lx)); ctx.lineTo(X(o.info.c[0]+ux*Lx), Y(o.info.c[1]+uy*Lx)); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;
      }
    }
  }

  // sockets
  for (let i=0;i<P.length;i++){
    const added = i >= L.pts.length;
    let sc = 1;
    if (born[i]){ const t = Math.min(1,(now-born[i])/450); sc = t<1 ? 1 + Math.sin(t*Math.PI)*.5 - (1-t)*.6 : 1; if (t>=1) delete born[i]; }
    ctx.strokeStyle = added ? grey : border; ctx.lineWidth = 2; if (added) ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(X(P[i][0]),Y(P[i][1]),dot*Math.max(.1,sc),0,TAU); ctx.stroke(); ctx.setLineDash([]);
  }

  // goal rings
  for (const [i,c] of L.goal){
    const done = !anim && colors[i] === c;
    let r = dot*1.75, w = done ? 4 : 2.5;
    if (solved){ const t = (now - solvedAt)/1000, wave = Math.max(0, 1 - Math.abs(t*2.2 - i*.25 - .2)); r += wave*dot*.6; }
    ctx.strokeStyle = PAL[c]; ctx.lineWidth = w;
    ctx.beginPath(); ctx.arc(X(P[i][0]),Y(P[i][1]),r,0,TAU); ctx.stroke();
  }

  // tokens
  const src = anim ? anim.from : colors;
  for (let i=0;i<P.length;i++){
    const p = tokenPos(i, k), c = src[i];
    let sc = 1; if (born[i]){ const t = Math.min(1,(now-born[i])/450); sc = Math.max(0, t*(1+Math.sin(t*Math.PI)*.4)); }
    ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]), (c ? dot : dot*.62)*sc, 0, TAU);
    if (i === hollowAt && !c){ ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke(); }
    else { ctx.fillStyle = c ? PAL[c] : ink; ctx.fill(); }
  }

  // symmetry center
  if (center && spokeAmt > .05 && !preview){
    ctx.globalAlpha = spokeAmt; ctx.strokeStyle = selC; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(X(center[0]),Y(center[1]),4,0,TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }

  if (anim && k >= 1) finishAnim();
}
requestAnimationFrame(draw);

/* ================= input ================= */
let paint = null;
function hit(e){
  const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const dot = Math.max(9, Math.min(16, view.md*view.s*0.16));
  let best = -1, bd = Math.max(26, dot*2.4);
  P.forEach((p,i)=>{ const d = Math.hypot(view.ox + p[0]*view.s - mx, view.oy - p[1]*view.s - my); if (d < bd){ bd = d; best = i; } });
  return best;
}
stage.addEventListener('pointerdown', e=>{
  if (!L || !settle()) return;
  audio();
  const i = hit(e);
  if (i < 0){
    // tapping empty board clears the selection (and any preview)
    if (sel.size || preview){ sel.clear(); preview = null; computeOpts(); sfx.deselect(); refresh(); }
    return;
  }
  stage.setPointerCapture(e.pointerId);
  paint = { id:e.pointerId, on: !sel.has(i) };
  setSel(i, paint.on);
});
stage.addEventListener('pointermove', e=>{
  if (!paint || paint.id !== e.pointerId) return;
  const i = hit(e); if (i >= 0 && sel.has(i) !== paint.on) setSel(i, paint.on);
});
const endPaint = e => { if (paint && paint.id === e.pointerId) paint = null; };
stage.addEventListener('pointerup', endPaint); stage.addEventListener('pointercancel', endPaint);

{ const c = curIndex(); loadLevel(levelOpen(c) ? c : lastOpen()); }
showScreen();
